name: flodo
description: A premium task management app — your personal task OS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP
  dio: ^5.4.3+1

  # Local Storage (drafts)
  shared_preferences: ^2.2.3

  # Drag & Drop reorder
  flutter_reorderable_list: ^1.0.0

  # Date picker
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.6
  phosphor_flutter: ^2.1.0

  # Animations
  flutter_animate: ^4.5.0

  # Google Fonts
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
